<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les Tours de Hanoï</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<style>
  :root {
    --page: #f3ede2;
    --panel: #fffaf2;
    --ink: #23303b;
    --muted: #6a7682;
    --line: #e2d8c6;
    --header: #1d2833;
    --accent: #f07c35;
    --accent-soft: #ffe7d6;
    --success: #3f9a52;
    --warning: #d9822b;
    --danger: #cf4436;
    --code-bg: #212121;
    --code-panel: #191919;
    --code-ink: #e6e6e6;
    --code-muted: #8d8d8d;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    font-family: "Fredoka", system-ui, sans-serif;
    color: var(--ink);
    background: var(--page);
  }

  code {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.88em;
    background: rgba(35, 48, 59, 0.08);
    padding: 1px 5px;
    border-radius: 5px;
  }

  /* Header. */
  .app-header {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px 20px;
    padding: 10px 16px;
    background: var(--header);
    color: white;
  }

  .app-title { margin: 0; font-size: 1.3rem; font-weight: 600; }
  .app-title small { margin-left: 8px; font-size: 0.9rem; font-weight: 400; color: #b9c4cf; }

  .progress { display: flex; align-items: center; gap: 10px; margin-left: auto; font-size: 0.95rem; }
  .progress__track { width: 160px; height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.15); overflow: hidden; }
  .progress__fill { width: 0; height: 100%; background: var(--accent); transition: width 0.6s ease; }

  .header-actions { display: flex; gap: 8px; }

  .header-button {
    font: inherit;
    font-size: 0.95rem;
    padding: 6px 14px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 999px;
    background: transparent;
    color: white;
    cursor: pointer;
  }

  .header-button:hover { background: rgba(255, 255, 255, 0.1); }
  .header-button.is-confirming { background: var(--danger); border-color: var(--danger); }

  /* Workspace. */
  .workspace {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 16px;
    padding: 16px;
  }

  .game-column { min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; padding-right: 4px; }

  /* Ferryman. */
  .ferryman { display: flex; align-items: flex-start; gap: 12px; }
  .ferryman__avatar { flex: none; font-size: 46px; line-height: 1; }
  .ferryman__avatar.is-happy { animation: hop 0.7s ease; }

  @keyframes hop {
    30% { transform: translateY(-12px) rotate(-8deg); }
    60% { transform: translateY(0) rotate(5deg); }
  }

  .ferryman__bubble {
    --bubble-border: var(--line);
    position: relative;
    flex: 1;
    min-height: 48px;
    padding: 10px 14px;
    border: 2px solid var(--bubble-border);
    border-radius: 16px;
    background: var(--panel);
    font-size: 1.05rem;
    line-height: 1.45;
  }

  .ferryman__bubble::before {
    content: "";
    position: absolute;
    top: 16px;
    left: -9px;
    width: 14px;
    height: 14px;
    background: var(--panel);
    border-left: 2px solid var(--bubble-border);
    border-bottom: 2px solid var(--bubble-border);
    transform: rotate(45deg);
  }

  .ferryman__bubble.is-success { --bubble-border: var(--success); animation: pop 0.35s ease-out; }
  .ferryman__bubble.is-warning { --bubble-border: var(--warning); }

  @keyframes pop {
    from { transform: scale(0.96); opacity: 0.4; }
  }

  .game-frame.is-restarting { animation: restart-flash 0.6s ease; }
  @keyframes restart-flash { 0% { opacity: 0.2; transform: scale(0.98); } 100% { opacity: 1; transform: none; } }
  .game-frame {
    flex: none;
    width: 100%;
    height: 580px;
    border: none;
    border-radius: 16px;
    background: #eef8ff;
    box-shadow: 0 4px 0 rgba(0, 0, 0, 0.06);
  }


  /* Guide: the three steps of the workshop. */
  .guide {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    margin: 0;
    padding: 0;
    list-style: none;
    counter-reset: guide;
  }

  .guide li {
    counter-increment: guide;
    padding: 8px 10px 8px 38px;
    position: relative;
    border-radius: 12px;
    background: var(--panel);
    border: 2px solid var(--line);
    font-size: 0.92rem;
    line-height: 1.3;
  }

  .guide li::before {
    content: counter(guide);
    position: absolute;
    top: 8px;
    left: 9px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--header);
    color: white;
    font-size: 0.8rem;
    font-weight: 600;
    display: grid;
    place-items: center;
  }

  /* Mission card. */
  .mission {
    padding: 14px 18px 16px;
    border: 3px solid var(--accent);
    border-radius: 18px;
    background: var(--panel);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .mission--done { border-color: var(--success); }
  .mission p { margin: 0; }
  .mission__label { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); }
  .mission--done .mission__label { color: var(--success); }
  .mission__title { margin: 0; font-size: 1.4rem; }
  .mission__kind { color: var(--muted); }
  .mission__facts { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: baseline; }
  .mission__facts dt { font-weight: 600; white-space: nowrap; }
  .mission__facts dd { margin: 0; line-height: 1.4; }
  .mission__notion { margin-left: 8px; color: var(--muted); font-size: 0.9rem; }
  .mission__check { color: var(--danger); line-height: 1.4; }
  .mission__alert { margin: 0 0 12px; padding: 10px 14px; border: 2px solid var(--danger); border-radius: 12px; background: #fff1f0; color: var(--danger); line-height: 1.4; }
  .mission__alert p { margin: 0 0 6px; }
  .mission__hint { padding: 10px 12px; border: 1px dashed var(--accent); border-radius: 10px; background: white; line-height: 1.5; }

  .file-link {
    font: inherit;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.9rem;
    padding: 2px 10px;
    border: 1px solid var(--accent);
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--ink);
    cursor: pointer;
  }

  .file-link:hover { background: white; }

  @media (max-width: 600px) {
    .guide { grid-template-columns: 1fr; }
    .mission__facts { grid-template-columns: 1fr; }
  }

  /* Score and jokers. */
  .score-strip { display: flex; align-items: center; gap: 14px; margin-left: auto; font-size: 1rem; }
  .score-strip__points strong { font-size: 1.15rem; }
  .score-strip__jokers { display: flex; gap: 3px; font-size: 1.25rem; }
  .joker-icon { display: inline-block; transition: opacity 0.3s, filter 0.3s; }
  .joker-icon.is-used { opacity: 0.25; filter: grayscale(1); }
  .score-strip + .progress { margin-left: 0; }

  .score-card { padding: 12px 16px 14px; border: 2px solid var(--line); border-radius: 16px; background: var(--panel); display: flex; flex-direction: column; gap: 8px; }
  .score-card h2 { margin: 0; font-size: 1.1rem; }
  .score-card p { margin: 0; line-height: 1.4; }
  .score-card__rules, .score-card__note { color: var(--muted); font-size: 0.92rem; }
  .score-card__warning { color: var(--danger); font-weight: 500; }
  .score-card__row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .score-card input { flex: 1; min-width: 180px; font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; background: white; }
  .score-card__code { margin: 0; padding: 8px 10px; border-radius: 10px; background: var(--code-bg); color: var(--code-ink); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; white-space: pre-wrap; overflow-wrap: anywhere; }

  .primary-button { font: inherit; font-weight: 600; padding: 7px 16px; border: none; border-radius: 999px; background: var(--accent); color: white; cursor: pointer; }
  .primary-button:hover { filter: brightness(1.05); }

  .joker-box { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border: 2px solid #8e6cd8; border-radius: 12px; background: #f3eefe; }
  .joker-box p { line-height: 1.5; }
  .joker-button { align-self: flex-start; font: inherit; font-weight: 600; padding: 5px 14px; border: none; border-radius: 999px; background: #8e6cd8; color: white; cursor: pointer; }
  .joker-button.is-confirming { background: var(--danger); }
  .joker-button:disabled { opacity: 0.5; cursor: not-allowed; }

  .points-toast { position: fixed; right: 20px; bottom: 20px; z-index: 10; padding: 10px 16px; border-radius: 14px; background: var(--header); color: white; font-weight: 600; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); animation: pop 0.3s ease-out; }

  .teacher-space { position: fixed; inset: 0; z-index: 20; overflow: auto; padding: 24px 16px; background: var(--page); }
  .teacher-space__panel { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .teacher-space textarea { width: 100%; min-height: 160px; padding: 10px; border: none; border-radius: 12px; background: var(--code-bg); color: var(--code-ink); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; }
  .teacher-table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; overflow: hidden; }
  .teacher-table th, .teacher-table td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; font-size: 0.95rem; }
  .teacher-table .number { text-align: right; font-variant-numeric: tabular-nums; }
  .teacher-table .is-bad { color: var(--danger); font-weight: 600; }

  /* Quests. */
  .quests { padding: 12px 16px 14px; border: 2px solid var(--line); border-radius: 16px; background: var(--panel); }
  .quests__header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .quests h2 { margin: 0 0 8px; font-size: 1.1rem; }
  .quests__status { font-size: 0.85rem; color: var(--muted); }

  .quest-list { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
  .quest { display: grid; grid-template-columns: 28px 1fr; gap: 2px 8px; padding: 6px 8px; border-radius: 10px; }
  .quest__icon { text-align: center; }
  .quest__title { font-weight: 500; }
  .quest__tag { margin-left: 6px; font-size: 0.82rem; font-weight: 400; color: var(--muted); }
  .quest--done { color: var(--muted); }
  .quest--current { background: var(--accent-soft); }
  .quest--locked { color: #b3aa9a; }


  .hint-button {
    font-weight: 500;
    align-self: flex-start;
    font: inherit;
    font-size: 0.9rem;
    padding: 3px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: white;
    cursor: pointer;
  }


  /* Code column. */
  .code-column { min-height: 0; display: flex; flex-direction: column; border-radius: 16px; background: var(--code-bg); overflow: hidden; }

  .tabs { display: flex; overflow-x: auto; background: var(--code-panel); }

  .tab {
    padding: 10px 14px;
    border: none;
    border-bottom: 2px solid transparent;
    background: transparent;
    color: var(--code-muted);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.85rem;
    white-space: nowrap;
    cursor: pointer;
  }

  .tab:hover { color: var(--code-ink); }
  .tab.is-active { color: var(--code-ink); background: var(--code-bg); border-bottom-color: var(--accent); }
  .tab__modified { margin-left: 4px; color: var(--accent); }

  .editor-status {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 12px;
    background: var(--code-bg);
    color: var(--code-muted);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.78rem;
    border-bottom: 1px solid #2c2c2c;
  }

  .editor { position: relative; flex: 1; min-height: 0; }
  .editor .CodeMirror { height: 100%; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 14px; line-height: 1.5; }
  .editor .highlighted-line { background: rgba(240, 124, 53, 0.28); }
  .editor .cm-s-material-darker .cm-comment { color: #9aa3ab; font-style: normal; }
  .editor .mission-line { background: rgba(240, 124, 53, 0.12); box-shadow: inset 3px 0 0 var(--accent); }
  .editor .mission-line .cm-comment { color: #ffb38a; font-weight: 600; }

  .fallback-editor {
    width: 100%;
    height: 100%;
    padding: 12px;
    border: none;
    resize: none;
    background: var(--code-bg);
    color: var(--code-ink);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 14px;
    line-height: 1.5;
    tab-size: 2;
  }

  /* Console. */
  .console { flex: none; height: 180px; display: flex; flex-direction: column; border-top: 1px solid #333; background: var(--code-panel); }
  .console__header { display: flex; align-items: center; justify-content: space-between; padding: 5px 12px; color: var(--code-muted); font-size: 0.85rem; }

  .console__clear {
    font: inherit;
    padding: 1px 10px;
    border: 1px solid #3a3a3a;
    border-radius: 999px;
    background: transparent;
    color: var(--code-muted);
    cursor: pointer;
  }

  .console__output { flex: 1; overflow-y: auto; padding: 0 12px 8px; color: var(--code-ink); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12.5px; }
  .console-line { padding: 3px 0; border-bottom: 1px solid #262626; white-space: pre-wrap; word-break: break-word; }
  .console-line--error { color: #ff8a80; }
  .console-line--warn { color: #ffd180; }
  .console-line--system { color: var(--code-muted); font-style: italic; }

  .console-link {
    padding: 0;
    border: none;
    background: none;
    color: #82b1ff;
    font: inherit;
    text-decoration: underline;
    cursor: pointer;
  }

  /* Hidden test frame: it stays in the layout so its timers run normally. */
  .test-frame { position: fixed; top: 0; left: -10000px; width: 760px; height: 600px; border: none; }

  @media (max-width: 1000px) {
    body { display: block; height: auto; }
    .workspace { grid-template-columns: 1fr; }
    .game-column { overflow: visible; }
    .code-column { height: 720px; }
  }

  @media (max-width: 600px) {
    .workspace { padding: 16px; }
    .progress { margin-left: 0; }
    .progress__track { width: 110px; }
  }
</style>
</head>

<header class="app-header">
  <h1 class="app-title">🛕 Les Tours de Hanoï <small>Répare le jeu pour pouvoir y jouer</small></h1>

    <span id="progress-label">0 / 9</span>

    <button id="run-button" class="header-button" type="button" title="Ctrl+S ou Cmd+S">▶ Relancer le jeu</button>

  </div>
</header>

<main class="workspace">
  <section class="game-column">
    <div class="ferryman">
      <div id="ferryman-avatar" class="ferryman__avatar" aria-hidden="true">🧘</div>
      <div id="ferryman-bubble" class="ferryman__bubble" aria-live="polite"></div>
    </div>

    <ol class="guide">
      <li><strong>Essaie le jeu</strong> et repère ce qui ne marche pas.</li>
      <li><strong>Corrige le code</strong> de <code>jeu.js</code>, dans l'éditeur.</li>
      <li>Le jeu <strong>se relance tout seul</strong> : le moine te dit si c'est réparé.</li>
    </ol>

    <section id="mission" class="mission" aria-live="polite"></section>

    <iframe id="play-frame" class="game-frame" sandbox="allow-scripts" title="Le jeu des Tours de Hanoï"></iframe>

    <section id="score-card" class="score-card"></section>

    <section class="quests">
      <div class="quests__header">
        <h2>Toutes les missions</h2>
        <span id="quests-status" class="quests__status"></span>
      </div>
      <ol id="quest-list" class="quest-list"></ol>
    </section>
  </section>

  <section class="code-column">
    <nav id="file-tabs" class="tabs" aria-label="Fichiers du jeu"></nav>
    <div class="editor-status">
      <span id="editor-file"></span>
      <span id="editor-run-status"></span>
    </div>
    <div id="editor" class="editor"></div>
    <div class="console">
      <div class="console__header">
        <span>Console</span>
        <button id="clear-console" class="console__clear" type="button">Effacer</button>
      </div>
      <div id="console-output" class="console__output"></div>
    </div>
  </section>
</main>

<section id="teacher-space" class="teacher-space" hidden></section>

<iframe id="test-frame" class="test-frame" sandbox="allow-scripts" title="Vérifications" aria-hidden="true" tabindex="-1"></iframe>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Les Tours de Hanoï</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&amp;display=swap">
</head>
<body>
  <main class="jeu">

    <!-- L'écran titre, caché quand la partie commence. -->
    <section id="ecran-titre" class="ecran-titre">
      <p class="ecran-titre__emojis">🛕 🧘 🛕</p>
      <h1>Les Tours de Hanoï</h1>
      <p>Dans le temple de Bénarès, un moine doit faire passer une pile de disques d'or<br>
         de la tour de gauche à la tour de droite.</p>
      <p>On ne déplace qu'un seul disque à la fois : celui du haut d'une tour.<br>
         On ne pose <strong>jamais</strong> un disque sur un disque plus petit.</p>
      <button id="bouton-commencer" class="bouton bouton--principal" type="button">Commencer</button>
    </section>

    <!-- La zone de jeu, visible quand la partie commence. -->
    <div id="zone-de-jeu" class="zone-de-jeu" hidden>
      <section class="reglages">
        <label>Disques :
          <select id="choix-disques">
            <option value="3" selected>3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
          </select>
        </label>
        <button id="bouton-recommencer" class="bouton" type="button">↺ Recommencer</button>
        <button id="bouton-moine" class="bouton" type="button">🧘 Laisse le moine faire</button>
      </section>

      <!-- Le temple : 3 tours. Clique sur une tour, puis sur une autre, pour déplacer un disque. -->
      <section id="temple" class="temple">
        <div class="tour" data-index="0"><div class="tour__tige"></div><div id="tour-0" class="tour__disques"></div><p class="tour__nom">gauche</p></div>
        <div class="tour" data-index="1"><div class="tour__tige"></div><div id="tour-1" class="tour__disques"></div><p class="tour__nom">milieu</p></div>
        <div class="tour" data-index="2"><div class="tour__tige"></div><div id="tour-2" class="tour__disques"></div><p class="tour__nom">droite</p></div>
      </section>

      <section class="barre">
        <p class="barre__compteur">Coups : <strong id="compteur-coups">0</strong></p>
        <p id="integrite" class="barre__integrite"></p>
        <p id="parole-moine" class="barre__parole"></p>
      </section>

      <section class="livre">
        <h2>📜 Le grand livre</h2>
        <ol id="grand-livre"></ol>
      </section>
    </div>

    <!-- L'écran de fin, par-dessus le jeu. -->
    <section id="ecran-fin" class="ecran-fin" hidden>
      <div class="ecran-fin__carte">
        <p id="message-fin" class="ecran-fin__message"></p>
        <ul id="statistiques" class="ecran-fin__stats"></ul>
        <button id="bouton-rejouer" class="bouton bouton--principal" type="button">Rejouer</button>
      </div>
    </section>

  </main>

  <!-- Le code du jeu. -->
  <script src="aides.js"></script>
  <script src="jeu.js"></script>

  <!-- L'apparence du jeu. -->
  <style>
    :root {
      --ciel-haut: #fde7c4;
      --ciel-bas: #fff8ec;
      --pierre: #c9a87c;
      --pierre-foncee: #8f6b45;
      --bois: #7a4b26;
      --papier: #fffaf0;
      --encre: #2d2a26;
      --gris: #6b6258;
      --orange: #e07a2f;
      --rouge: #c8433a;
      --vert: #3f9a52;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Fredoka", system-ui, sans-serif;

    .jeu {
      position: relative;
      max-width: 760px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 16px;
    }

    /* Écran titre. */
    .ecran-titre {
      padding: 32px 16px;
      text-align: center;

    .ecran-titre__emojis {

    .ecran-titre .bouton {

    /* Boutons. */
    .bouton {
      padding: 9px 20px;
      border: none;
      border-radius: 999px;

      color: var(--encre);
      font: inherit;
      font-weight: 600;

    .bouton:disabled {
      opacity: 0.5;
      cursor: not-allowed;

      background: var(--orange);
      color: white;
      font-size: 1.15rem;
    }

    .zone-de-jeu {
      display: flex;
      flex-direction: column;
      gap: 12px;

      display: flex;

      gap: 10px;
      align-items: center;

      padding: 6px 10px;
      border-radius: 10px;
      border: 2px solid var(--pierre);
      background: var(--papier);
    }

    /* Le temple et ses 3 tours. */
    .temple {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 18px 12px 0;
      border-radius: 18px 18px 8px 8px;
      background: linear-gradient(#f6dcb3, #edcb98);
      border-bottom: 14px solid var(--pierre-foncee);
    }

    .tour {
      position: relative;
      display: flex;

      justify-content: flex-end;
      min-height: 250px;
      padding-top: 40px;
      border-radius: 12px;
      cursor: pointer;
    }

    .tour:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .tour--choisie {
      background: rgba(255, 255, 255, 0.45);
      outline: 3px dashed var(--orange);
    }

    .tour__tige {
      position: absolute;
      bottom: 30px;
      width: 10px;
      height: 200px;
      border-radius: 6px 6px 0 0;
      background: var(--bois);
    }

    /* Les disques sont empilés de bas en haut. */
    .tour__disques {
      position: relative;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 2px;
      width: 100%;
    }

    .tour__nom {
      margin: 6px 0 8px;
      color: var(--gris);
      font-size: 0.9rem;
    }

    .disque {
      width: 0;
      height: 22px;
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.95);
      font-size: 0.8rem;
      font-weight: 600;
      line-height: 22px;
      text-align: center;
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.18);
      transition: transform 0.15s ease;
    }

    /* Le disque du haut de la tour choisie se soulève. */
    .tour--choisie .disque:last-child {
      transform: translateY(-26px);
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.18), 0 8px 10px rgba(0, 0, 0, 0.2);
    }

    /* Sous le temple. */
    .barre {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 16px;
      padding: 10px 14px;
      border-radius: 14px;
      background: var(--papier);
    }

    .barre p {
      margin: 0;
    }

    .barre__integrite.is-alerte {
      color: var(--rouge);
      font-weight: 600;
    }

    .barre__parole {
      flex: 1 1 100%;
      min-height: 1.4em;
      color: var(--orange);
      font-weight: 600;
    }

    .livre {
      padding: 10px 14px;
      border-radius: 14px;
      background: var(--papier);

    .livre h2 {
      margin: 0 0 6px;
      font-size: 1.05rem;
    }

    .livre ol {
      margin: 0;
      padding-left: 1.6em;

<script type="text/plain" id="original-aides.js">
// =====================================================================
// AIDES : petites fonctions utiles au jeu (jeu.js).
// Tu n'as pas besoin de modifier ce fichier, mais tu peux le lire.
// =====================================================================

// Crée l'élément de la page qui dessine un disque.
// Plus le disque est grand, plus il est large. Sa couleur vient de disque.couleur.
function creerElementDisque(disque) {
  const element = document.createElement("div");
  element.className = "disque";
  element.style.width = 16 + disque.taille * 12 + "%";
  element.style.background = disque.couleur;
  element.textContent = disque.taille ?? "";
  return element;
}

// Transforme un coup en phrase.
// Exemple : { taille: 2, depart: 0, arrivee: 2 } donne « Disque 2 : gauche → droite ».
function decrireCoup(coup) {
  return `Disque ${coup.taille} : ${NOMS_DES_TOURS[coup.depart]} → ${NOMS_DES_TOURS[coup.arrivee]}`;
}

// Affiche une petite phrase du moine, sous le temple.
function moineDit(phrase) {
  document.querySelector("#parole-moine").textContent = phrase;
}

// Attend un moment. S'utilise avec await, dans une fonction async :
//   await attendre(500);   // attend une demi-seconde
function attendre(millisecondes) {
  return new Promise((reprendre) => setTimeout(reprendre, millisecondes));
}
</script>

// La couleur de chaque disque : le disque 1 a la couleur de la case 0, le disque 2 celle de la case 1…
const COULEURS = ["#e74c3c", "#f39c12", "#f1c40f", "#2ecc71", "#3498db", "#9b59b6", "#e84393"];

// Le nom des 3 tours, dans l'ordre : la tour 0 est à gauche, la tour 2 à droite.

// Le nombre de disques au début d'une partie.
const NB_DISQUES_AU_DEPART = 3;

// Quand le moine joue tout seul, il attend un peu entre deux coups (en millisecondes).
const PAUSE_DU_MOINE_MS = 450;

// Vaut true quand le joueur a cliqué sur « Commencer ».
let jeuDemarre = false;


// =====================================================================
// 2. LES CLASSES

// Un disque d'or. Exemple : new Disque(2) crée le disque de taille 2.
class Disque {
  constructor(taille) {

    //   - sa taille : celle reçue en paramètre ;
    //   - sa couleur : la case taille - 1 du tableau COULEURS (partie 1).

// Une tour : une pile de disques. Le bas de la tour est la case 0 du tableau,
// le haut de la tour est la dernière case.
class Tour {
  constructor(nom) {
    this.nom = nom;
    this.disques = [];
  }

  // Renvoie true si la tour n'a aucun disque.
  estVide() {
    return this.disques.length === 0;
  }

  // Le disque du haut de la tour (sans l'enlever), ou null si la tour est vide.
  // On l'utilise sans parenthèses : tour.sommet
  get sommet() {
    // 🧩 MISSION 2 : écris ici le code du getter.
    // 1) Si la tour est vide, renvoie null.
    // 2) Sinon, renvoie le disque de la dernière case du tableau this.disques.
    return null;
  }

  // Pose un disque en haut de la tour.
  empiler(disque) {
    this.disques.push(disque);
  }

  // 🐞 MISSION 4 : le bug se cache dans cette méthode.
  // Enlève le disque du haut de la tour, et le renvoie.
  depiler() {
    return this.disques.shift();
  }

  // 🐞 MISSION 5 : le bug se cache dans cette méthode.
  // Renvoie true si on a le droit de poser ce disque sur la tour.
  peutRecevoir(disque) {
    if (this.estVide()) {
      return true;
    }
    return disque.taille > this.sommet.taille;
  }
}

// Une partie : les 3 tours et la liste des coups joués.
class Jeu {
  constructor(nbDisques) {
    this.nbDisquesAuDepart = nbDisques;
    this.tours = [new Tour("gauche"), new Tour("milieu"), new Tour("droite")];
    // L'historique : un objet { taille, depart, arrivee } par coup joué.
    this.historique = [];
    // Au début, tous les disques sont sur la tour de gauche, du plus grand au plus petit.
    for (let taille = nbDisques; taille >= 1; taille--) {
      this.tours[0].empiler(new Disque(taille));
    }
  }

  // Le nombre de coups joués. On l'utilise sans parenthèses : jeu.nbCoups
  get nbCoups() {
    return this.historique.length;
  }

  // 🐞 MISSION 3 : le bug se cache dans cette méthode.
  // Déplace le disque du haut de la tour depart vers la tour arrivee (0, 1 ou 2).
  // Renvoie "" si le coup est joué, ou une phrase qui explique pourquoi il est interdit.
  deplacer(depart, arrivee) {
    const tourDeDepart = this.tours[depart];
    const tourDArrivee = tours[arrivee];

    if (tourDeDepart.estVide()) {
      return "Il n'y a aucun disque sur cette tour.";
    }
    if (!tourDArrivee.peutRecevoir(tourDeDepart.sommet)) {
      return "Sacrilège ! On ne pose jamais un disque sur un disque plus petit.";
    }

    const disque = tourDeDepart.depiler();
    tourDArrivee.empiler(disque);
    this.historique.push({ taille: disque.taille, depart: depart, arrivee: arrivee });
    return "";
  }

  // Compte les disques des 3 tours. Si un disque disparaît, le moine le verra !
  nbDisques() {
    // 🧩 MISSION 6 : avec reduce, additionne le nombre de disques de chaque tour de this.tours.
    // Le total commence à 0. Le nombre de disques d'une tour : tour.disques.length
    return 0;
  }

  // 🧩 MISSION 7 : écris le code de estGagne() et de coupsMinimum.
  // La partie est gagnée quand la tour de droite (this.tours[2]) contient tous les disques.
  estGagne() {
    return false;
  }

  // La prophétie : avec n disques, il faut au minimum 2 puissance n, moins 1, coups.
  // En JavaScript, « 2 puissance n » s'écrit 2 ** n.
  get coupsMinimum() {
    return 0;
  }

  // 🐞 MISSION 8 : le bug se cache dans cette méthode.
  // Renvoie un tableau de phrases : une par coup joué, pour le grand livre.
  lignesDuGrandLivre() {
    const lignes = this.historique.forEach((coup) => decrireCoup(coup));
    return lignes;
  }

  // Compte combien de fois chaque disque a bougé.
  // Exemple pour 3 disques et 7 coups : { 1: 4, 2: 2, 3: 1 }.
  mouvementsParDisque() {
    // 🧩 MISSION 9 : avec reduce, fabrique cet objet à partir de this.historique.
    // On part d'un objet vide {}. Pour chaque coup, on ajoute 1 au compteur du disque coup.taille
    // (s'il n'a pas encore de compteur, il vaut 0).
    return {};
  }
}

// 🧩 MISSION 10 : (bonus) apprends au moine à résoudre l'énigme tout seul.
// Ajoute dans le tableau coups, dans l'ordre, les coups qui déplacent n disques
// de la tour depart vers la tour arrivee, en s'aidant de la tour intermediaire.
// Un coup s'écrit [depart, arrivee]. Exemple : coups.push([0, 2]);
// Le secret du moine, pour déplacer n disques :
//   1) s'il n'y a aucun disque (n vaut 0), il n'y a rien à faire ;
//   2) il déplace les n - 1 disques du dessus vers la tour intermediaire ;
//   3) il déplace le grand disque vers la tour arrivee ;
//   4) il déplace les n - 1 disques de la tour intermediaire vers la tour arrivee.
// Pour déplacer les n - 1 disques… la fonction s'appelle elle-même !

// La partie en cours. Tout l'écran est dessiné à partir de cet objet.
let jeu = new Jeu(NB_DISQUES_AU_DEPART);


// =====================================================================
// 3. L'AFFICHAGE
// =====================================================================

// Les éléments de la page que le jeu modifie (leurs id sont dans index.html).
const ecranTitre = document.querySelector("#ecran-titre");
const zoneDeJeu = document.querySelector("#zone-de-jeu");
const temple = document.querySelector("#temple");
const compteurCoups = document.querySelector("#compteur-coups");
const integrite = document.querySelector("#integrite");
const grandLivre = document.querySelector("#grand-livre");
const ecranFin = document.querySelector("#ecran-fin");
const messageFin = document.querySelector("#message-fin");
const statistiques = document.querySelector("#statistiques");
const choixDisques = document.querySelector("#choix-disques");
const boutonCommencer = document.querySelector("#bouton-commencer");
const boutonRecommencer = document.querySelector("#bouton-recommencer");
const boutonMoine = document.querySelector("#bouton-moine");
const boutonRejouer = document.querySelector("#bouton-rejouer");

// La tour choisie par le joueur (0, 1 ou 2), ou null si aucune.
let tourChoisie = null;

// Vaut true pendant que le moine joue tout seul.
let moineAuTravail = false;

// Redessine tout l'écran à partir des données de `jeu`.
function afficherJeu() {
  ecranTitre.hidden = jeuDemarre;
  zoneDeJeu.hidden = !jeuDemarre;
  for (let index = 0; index < jeu.tours.length; index++) {
    afficherTour(index);
  }
  compteurCoups.textContent = jeu.nbCoups;
  afficherIntegrite();
  afficherGrandLivre();
  afficherFin();
  boutonMoine.disabled = moineAuTravail;
  boutonRecommencer.disabled = moineAuTravail;
  choixDisques.disabled = moineAuTravail;
}

// Dessine les disques d'une tour, du bas vers le haut.
function afficherTour(index) {
  const elementDisques = document.querySelector("#tour-" + index);
  elementDisques.innerHTML = "";
  for (const disque of jeu.tours[index].disques) {
    elementDisques.append(creerElementDisque(disque));
  }
  elementDisques.parentElement.classList.toggle("tour--choisie", tourChoisie === index);
}

// Vérifie qu'aucun disque n'a disparu.
function afficherIntegrite() {
  const nombre = jeu.nbDisques();
  const alerte = nombre !== jeu.nbDisquesAuDepart;
  integrite.textContent = `Disques : ${nombre} / ${jeu.nbDisquesAuDepart}` + (alerte ? " ⚠ Un disque a disparu !" : " ✔");
  integrite.classList.toggle("is-alerte", alerte);
}

// Remplit le grand livre : une ligne par coup joué.
function afficherGrandLivre() {
  grandLivre.innerHTML = "";
  const lignes = jeu.lignesDuGrandLivre();
  if (!Array.isArray(lignes)) {
    return;
  }
  for (const ligne of lignes) {
    const elementLigne = document.createElement("li");
    elementLigne.textContent = ligne;
    grandLivre.append(elementLigne);
  }
}

// Montre l'écran de fin quand la partie est gagnée, et le cache sinon.
function afficherFin() {
  const gagne = jeu.estGagne();
  ecranFin.hidden = !gagne;
  if (!gagne) {
    return;
  }

  if (jeu.nbCoups === jeu.coupsMinimum) {
    messageFin.textContent = `La prophétie est accomplie en ${jeu.nbCoups} coups : c'est le minimum ! 🏅`;
  } else {
    messageFin.textContent = `Bravo, tu as fini en ${jeu.nbCoups} coups. La prophétie en demandait ${jeu.coupsMinimum}…`;
  }

  statistiques.innerHTML = "";
  const mouvements = jeu.mouvementsParDisque();
  for (const taille of Object.keys(mouvements)) {
    const element = document.createElement("li");
    element.textContent = `Disque ${taille} : ${mouvements[taille]} mouvement(s)`;
    statistiques.append(element);
  }
}


// =====================================================================
// 4. LES ACTIONS : ce qui se passe quand le joueur clique
// =====================================================================

// Bouton « Commencer » : cache l'écran titre et montre le temple.
function commencerPartie() {
  jeuDemarre = true;
  afficherJeu();
}

// Boutons « Recommencer » et « Rejouer », et changement du nombre de disques.
function recommencerPartie() {
  jeu = new Jeu(Number(choixDisques.value));
  tourChoisie = null;
  moineDit("");
  afficherJeu();
}

// Clic sur une tour : le premier clic choisit la tour de départ, le second la tour d'arrivée.
function cliquerSurTour(index) {
  if (moineAuTravail || jeu.estGagne()) {
    return;
  }

  if (tourChoisie === null) {
    if (jeu.tours[index].sommet === null) {
      moineDit("Il n'y a aucun disque sur cette tour.");
    } else {
      tourChoisie = index;
      moineDit("");
    }
  } else if (tourChoisie === index) {
    // Un deuxième clic sur la même tour : on repose le disque.
    tourChoisie = null;
  } else {
    const probleme = jeu.deplacer(tourChoisie, index);
    moineDit(probleme);
    tourChoisie = null;
  }

  afficherJeu();
}

// Bouton « Laisse le moine faire » : le moine joue tout seul, coup par coup.
async function laisserLeMoineFaire() {
  if (moineAuTravail) {
    return;
  }
  recommencerPartie();

  const coups = [];
  resoudre(jeu.nbDisquesAuDepart, 0, 2, 1, coups);
  if (coups.length === 0) {
    moineDit("Je ne sais pas encore résoudre l'énigme tout seul… (c'est la mission bonus)");
    return;
  }

  moineAuTravail = true;
  moineDit("Regarde bien…");
  afficherJeu();
  for (const coup of coups) {
    await attendre(PAUSE_DU_MOINE_MS);
    jeu.deplacer(coup[0], coup[1]);
    afficherJeu();
  }
  moineAuTravail = false;
  moineDit("");
  afficherJeu();
}


// =====================================================================
// 5. LES BOUTONS : on relie chaque bouton de la page à son action
// =====================================================================

boutonCommencer.addEventListener("click", commencerPartie);

// Clic dans le temple : on cherche la tour cliquée.
temple.addEventListener("click", (evenement) => {
  const tourCliquee = evenement.target.closest(".tour");
  if (tourCliquee === null) {
    return;
  }
  cliquerSurTour(Number(tourCliquee.dataset.index));
});

boutonRecommencer.addEventListener("click", recommencerPartie);
choixDisques.addEventListener("change", recommencerPartie);
boutonRejouer.addEventListener("click", recommencerPartie);
boutonMoine.addEventListener("click", laisserLeMoineFaire);

// Premier dessin de l'écran, au chargement de la page.
afficherJeu();
</script>

/* ---------- Browser storage (it may be blocked, so every access is protected). ---------- */

function readStorage(key, fallback) {
  try {
    const value = localStorage.getItem(STORAGE_PREFIX + key);
    return value === null ? fallback : value;
  } catch (error) {
    return fallback;
  }
}

function writeStorage(key, value) {
  try {
    localStorage.setItem(STORAGE_PREFIX + key, value);
  } catch (error) {
    // Nothing to do: the work is simply not saved.
  }
}

function removeStorage(key) {
  try {
    localStorage.removeItem(STORAGE_PREFIX + key);
  } catch (error) {
    // Nothing to do.
  }
}

/* ---------- Files. ---------- */

const originalContents = {};
const contents = {};

for (const file of FILES) {
  const source = document.getElementById("original-" + file.name);
  const text = source.tagName === "TEXTAREA" ? source.value : source.textContent.replace(/^\n/, "");
  originalContents[file.name] = text;
  contents[file.name] = file.readOnly ? text : readStorage("file." + file.name, text);
}

function findFile(fileName) {
  return FILES.find((file) => file.name === fileName);
}

function isModified(fileName) {
  return contents[fileName] !== originalContents[fileName];
}

let codeMirror = null;
const codeMirrorDocuments = {};
let fallbackTextarea = null;

function setupEditor() {
  if (typeof window.CodeMirror === "function") {
    codeMirror = window.CodeMirror(editorElement, {
      theme: "material-darker",
      lineNumbers: true,
      indentUnit: 2,
      tabSize: 2,
      matchBrackets: true,
      autoCloseBrackets: true,
      extraKeys: {
        "Ctrl-S": () => restartByHand(),
        "Cmd-S": () => restartByHand(),
        Tab: (editor) => editor.execCommand("insertSoftTab"),
      },
    });
    for (const file of FILES) {
      const documentForFile = window.CodeMirror.Doc(contents[file.name], file.mode);
      documentForFile.on("change", () => {
        handleEdit(file.name, documentForFile.getValue());
        markMissionLines(documentForFile);
      });
      markMissionLines(documentForFile);
      codeMirrorDocuments[file.name] = documentForFile;
    }
    return;
  }

  // Without CodeMirror (for example offline), a simple text area is used.
  fallbackTextarea = document.createElement("textarea");
  fallbackTextarea.className = "fallback-editor";
  fallbackTextarea.spellcheck = false;
  fallbackTextarea.addEventListener("input", () => handleEdit(activeFileName, fallbackTextarea.value));
  fallbackTextarea.addEventListener("keydown", (event) => {
    if (event.key === "Tab") {
      event.preventDefault();
      fallbackTextarea.setRangeText("  ", fallbackTextarea.selectionStart, fallbackTextarea.selectionEnd, "end");
      handleEdit(activeFileName, fallbackTextarea.value);
    }
  });
  editorElement.append(fallbackTextarea);
}

function markMissionLines(documentForFile) {
  documentForFile.eachLine((lineHandle) => {
    documentForFile.removeLineClass(lineHandle, "wrap", "mission-line");
    if (/\/\/ (🧩|🐞) MISSION \d+ :/.test(lineHandle.text)) {
      documentForFile.addLineClass(lineHandle, "wrap", "mission-line");

  });
}

function showFile(fileName) {
  const file = findFile(fileName);
  activeFileName = fileName;
  writeStorage("activeFile", fileName);

  if (codeMirror) {
    codeMirror.swapDoc(codeMirrorDocuments[fileName]);
    codeMirror.setOption("readOnly", file.readOnly);
    codeMirror.refresh();
  } else {
    fallbackTextarea.value = contents[fileName];
    fallbackTextarea.readOnly = file.readOnly;
  }

  editorFileLabel.textContent = file.readOnly ? fileName + " · 🔒 lecture seule" : fileName;
  renderTabs();
}

function setFileContent(fileName, text) {
  if (codeMirror) {
    codeMirrorDocuments[fileName].setValue(text);
  } else {
    contents[fileName] = text;
    if (fileName === activeFileName) {
      fallbackTextarea.value = text;
    }
  }
}

function handleEdit(fileName, text) {
  contents[fileName] = text;
  if (!findFile(fileName).readOnly) {
    writeStorage("file." + fileName, text);
  }
  renderTabs();
  scheduleRun();
}

function renderTabs() {

  for (const file of FILES) {

      tab.append(marker);

    tab.addEventListener("click", () => showFile(file.name));

}

// Opens the file of a mission and scrolls to its marker comment, for example "MISSION 2 :".
function jumpToMission(step, shouldFocus = true) {
  const lines = contents[step.file].split("\n");
  const markerIndex = lines.findIndex((line) => line.includes("MISSION " + step.id + " :"));
  if (markerIndex === -1) {
    showFile(step.file);
    return;
  }
  jumpToLine(step.file, markerIndex + 1, 1, shouldFocus);
}

function jumpToLine(fileName, line, column, shouldFocus = true) {
  showFile(fileName);
  if (!codeMirror) {
    return;
  }
  const lineIndex = Math.max(0, line - 1);
  codeMirror.setCursor({ line: lineIndex, ch: Math.max(0, (column || 1) - 1) });
  // Show the line near the top of the editor, with a little space above it.
  codeMirror.scrollTo(null, Math.max(0, codeMirror.heightAtLine(lineIndex, "local") - 40));
  if (shouldFocus) {
    codeMirror.focus();
  }
  codeMirror.addLineClass(lineIndex, "background", "highlighted-line");
  setTimeout(() => codeMirror.removeLineClass(lineIndex, "background", "highlighted-line"), 2500);
}

/* ---------- Protection against infinite loops. ---------- */

const LOOP_TYPES = new Set(["ForStatement", "ForInStatement", "ForOfStatement", "WhileStatement", "DoWhileStatement"]);
const LOOP_GUARD_CALL = "__passeurLoopGuard();";

function visitTree(node, callback) {
  callback(node);
  for (const key of Object.keys(node)) {
    const value = node[key];
    if (Array.isArray(value)) {
      for (const child of value) {
        if (child && typeof child.type === "string") {
          visitTree(child, callback);
        }
      }
    } else if (value && typeof value.type === "string") {
      visitTree(value, callback);
    }
  }
}

// Adds a guard call at the start of every loop body. Line numbers do not change.
function addLoopGuards(tree, code) {
  const insertions = [];
  visitTree(tree, (node) => {
    if (!LOOP_TYPES.has(node.type)) {
      return;
    }
    if (node.body.type === "BlockStatement") {
      insertions.push({ at: node.body.start + 1, text: LOOP_GUARD_CALL });
    } else {
      insertions.push({ at: node.body.start, text: "{" + LOOP_GUARD_CALL });
      insertions.push({ at: node.body.end, text: "}" });
    }
  });

  insertions.sort((first, second) => second.at - first.at);
  let guardedCode = code;
  for (const insertion of insertions) {
    guardedCode = guardedCode.slice(0, insertion.at) + insertion.text + guardedCode.slice(insertion.at);
  }
  return guardedCode;
}

// Checks the syntax of each script and protects its loops.
function prepareScripts() {
  const scripts = {};
  const syntaxErrors = [];

  for (const file of FILES) {
    if (file.mode !== "javascript") {
      continue;
    }
    const code = contents[file.name];
    if (typeof window.acorn === "undefined") {
      scripts[file.name] = code;
      continue;
    }
    try {
      const tree = window.acorn.parse(code, { ecmaVersion: "latest", sourceType: "script", locations: true });
      scripts[file.name] = addLoopGuards(tree, code);
    } catch (error) {
      scripts[file.name] = "";
      syntaxErrors.push({
        fileName: file.name,
        message: String(error.message).replace(/\s*\(\d+:\d+\)$/, ""),
        line: error.loc ? error.loc.line : 1,
        column: error.loc ? error.loc.column + 1 : 1,
      });
    }
  }
  return { scripts, syntaxErrors };
}

/* ---------- Code that runs inside the game frames. ---------- */

// Runs first in each game frame: it sends console messages and errors to the workshop.
function iframePrelude(channel, runId, maxLoopTurns) {
  function send(type, payload) {
    parent.postMessage(Object.assign({ passeur: true, channel, runId, type }, payload), "*");
  }

  function format(value) {
    if (typeof value === "string") {
      return value;
    }
    try {
      const text = JSON.stringify(value);
      return text === undefined ? String(value) : text;
    } catch (error) {
      return String(value);
    }
  }

  for (const level of ["log", "info", "warn", "error"]) {
    const original = console[level].bind(console);
    console[level] = (...values) => {
      original(...values);
      send("console", { level, text: values.map(format).join(" ") });
    };
  }

  window.addEventListener("error", (event) => {
    send("error", { message: event.message, line: event.lineno, column: event.colno, stack: event.error && event.error.stack ? String(event.error.stack) : "" });
  });

  window.addEventListener("unhandledrejection", (event) => {
    const reason = event.reason;
    send("error", { message: "Uncaught (in promise) " + (reason && reason.message ? reason.message : String(reason)), line: 0, column: 0 });
  });

  let loopTurns = 0;
  let resetPlanned = false;
  window.__passeurLoopGuard = () => {
    loopTurns += 1;
    if (!resetPlanned) {
      resetPlanned = true;
      setTimeout(() => {
        loopTurns = 0;
        resetPlanned = false;
      }, 0);
    }
    if (loopTurns > maxLoopTurns) {
      loopTurns = 0;
      throw new Error("Boucle infinie arrêtée : une boucle a fait plus de " + maxLoopTurns + " tours. Vérifie sa condition de fin.");
    }
  };
}

// Runs last in the hidden test frame: it checks each step in order and sends the results.
function iframeTestHarness(runId, stepCount) {
  // The shortest solution with 3 disks: [from, to] for each move.
  const SOLUTION_3 = [[0, 2], [0, 1], [2, 1], [0, 2], [1, 0], [1, 2], [0, 2]];

  class StepFailure extends Error {}

  function fail(message) {
    throw new StepFailure(message);
  }

  function newRound(nbDisks) {
    jeu = new Jeu(nbDisks);
    tourChoisie = null;
    moineAuTravail = false;
    jeuDemarre = true;
    afficherJeu();
  }

  function sizes(tower) {
    return tower.disques.map((disk) => disk.taille).join(",");
  }

  // A reference solver, used only by the tests.
  function referenceMoves(n, from, to, via, moves) {
    if (n === 0) {
      return moves;
    }
    referenceMoves(n - 1, from, via, to, moves);
    moves.push([from, to]);
    referenceMoves(n - 1, via, to, from, moves);
    return moves;
  }

  function playMoves(moves) {
    moves.forEach((move, index) => {
      let problem;
      try {
        problem = jeu.deplacer(move[0], move[1]);

        fail("au coup n°" + (index + 1) + ", le jeu plante : « " + error.message + " ».");
      }
      if (problem) {

      }
    });
  }

  function towerWith(diskSizes) {
    const tower = new Tour("test");
    for (const size of diskSizes) {
      tower.empiler(new Disque(size));
    }
    return tower;
  }

  function sameObject(first, second) {
    const keys = Object.keys(first).sort();
    return keys.join() === Object.keys(second).sort().join() && keys.every((key) => first[key] === second[key]);
  }

  const CHECKS = {

      const top = tower.sommet;

      }

    3: () => {

      try {

      } catch (error) {
        fail("j'ai déplacé un disque de la tour de gauche vers la tour de droite, et le jeu plante : « " + error.message + " ».");

      if (jeu.tours[0].disques.length !== 2 || jeu.tours[2].disques.length !== 1) {

      }

    4: () => {

      const removed = tower.depiler();

      }
      if (sizes(tower) !== "3,2") {
        fail("après `depiler()`, la tour devrait garder les disques 3 et 2.");
      }
      newRound(3);
      jeu.deplacer(0, 2);
      if (sizes(jeu.tours[2]) !== "1") {
        fail("au premier coup, c'est le petit disque 1 qui doit arriver sur la tour de droite.");
      }
    },

    5: () => {
      const cases = [
        { tower: [], disk: 3, allowed: true, label: "sur une tour vide, on peut poser le disque 3" },
        { tower: [3], disk: 1, allowed: true, label: "on peut poser le disque 1 sur le disque 3" },
        { tower: [3, 2], disk: 1, allowed: true, label: "on peut poser le disque 1 sur le disque 2" },
        { tower: [1], disk: 3, allowed: false, label: "on ne peut pas poser le disque 3 sur le disque 1" },
        { tower: [2], disk: 3, allowed: false, label: "on ne peut pas poser le disque 3 sur le disque 2" },
      ];
      for (const testCase of cases) {
        const result = towerWith(testCase.tower).peutRecevoir(new Disque(testCase.disk));
        if (result !== testCase.allowed) {
          fail(testCase.label + " : `peutRecevoir` devrait renvoyer " + testCase.allowed + ", mais elle renvoie " + result + ".");
        }
      }
      newRound(3);
      jeu.deplacer(0, 1);
      const problem = jeu.deplacer(0, 1);
      if (!problem || jeu.tours[1].disques.length !== 1) {
        fail("j'ai essayé de poser le disque 2 sur le disque 1 : le jeu doit refuser ce coup.");
      }
    },

    6: () => {
      for (const n of [3, 5]) {
        newRound(n);
        if (jeu.nbDisques() !== n) {
          fail("au début d'une partie à " + n + " disques, `nbDisques()` renvoie " + jeu.nbDisques() + " au lieu de " + n + ".");
        }
      }
      newRound(3);
      jeu.tours[0].disques = [new Disque(3), new Disque(2)];
      jeu.tours[1].disques = [];
      jeu.tours[2].disques = [new Disque(1)];
      if (jeu.nbDisques() !== 3) {
        fail("avec 2 disques à gauche et 1 à droite, `nbDisques()` renvoie " + jeu.nbDisques() + " au lieu de 3 : il faut compter les disques des 3 tours.");
      }
      if (!String(Jeu.prototype.nbDisques).includes("reduce")) {
        fail("le résultat est juste, mais cette mission demande d'utiliser `reduce`.");
      }
    },

    7: () => {
      newRound(3);
      if (jeu.estGagne()) {
        fail("au début de la partie, `estGagne()` doit renvoyer false.");
      }
      playMoves(SOLUTION_3.slice(0, 6));
      if (jeu.estGagne()) {
        fail("après 6 coups, il reste un disque à gauche : `estGagne()` doit encore renvoyer false.");
      }
      playMoves(SOLUTION_3.slice(6));
      if (!jeu.estGagne()) {
        const source = String(Jeu.prototype.estGagne);
        const comparesTower = /tours\[2\]\s*(===|==|>=|<=|>|<)/.test(source) || /(===|==)\s*this\.tours\[2\]\s*[;)]/.test(source);
        fail("les 3 disques sont sur la tour de droite, mais `estGagne()` renvoie false." +
          (comparesTower ? " Attention : `this.tours[2]` est une tour (un objet `Tour`), pas un nombre. Comment savoir combien de disques elle contient ?" : ""));
      }
      afficherJeu();
      if (document.querySelector("#ecran-fin").hidden) {
        fail("la partie est gagnée, mais l'écran de victoire ne s'affiche pas.");
      }
      newRound(3);
      jeu.tours[1].disques = jeu.tours[0].disques;
      jeu.tours[0].disques = [];
      if (jeu.estGagne()) {
        fail("tous les disques sont sur la tour du milieu : ce n'est pas gagné, il faut qu'ils soient sur la tour de droite.");
      }
      const minimums = {};
      for (const n of [3, 5]) {
        newRound(n);
        minimums[n] = jeu.coupsMinimum;
      }
      for (const n of [3, 5]) {
        const expected = 2 ** n - 1;
        if (minimums[n] !== expected) {
          let advice = "";
          if (minimums[3] === minimums[5]) {
            advice = " Ta formule donne le même résultat avec 3 et avec 5 disques : elle doit dépendre du nombre de disques (`this.nbDisquesAuDepart`).";
          } else if (minimums[n] === n ** 2 - 1) {
            advice = " Tu as calculé n au carré (n ** 2). La prophétie dit « 2 puissance n » : c'est 2 qui est élevé à la puissance n.";
          }
          fail("avec " + n + " disques, `coupsMinimum` devrait valoir " + expected + " (2 × 2 × … " + n + " fois, moins 1). Il vaut " + minimums[n] + "." + advice);
        }
      }
    },

    8: () => {
      newRound(3);
      playMoves(SOLUTION_3);
      const lines = jeu.lignesDuGrandLivre();
      if (!Array.isArray(lines)) {
        fail("`lignesDuGrandLivre()` doit renvoyer un tableau. Elle renvoie « " + lines + " ».");
      }
      if (lines.length !== 7 || lines.some((line) => typeof line !== "string" || line.includes("undefined"))) {
        fail("après 7 coups, le grand livre devrait avoir 7 phrases, comme « Disque 1 : gauche → droite ».");
      }
      afficherJeu();
      if (document.querySelectorAll("#grand-livre li").length !== 7) {
        fail("après 7 coups, le grand livre devrait afficher 7 lignes.");
      }
    },

    9: () => {
      for (const n of [3, 4]) {
        newRound(n);
        playMoves(referenceMoves(n, 0, 2, 1, []));
        const counts = jeu.mouvementsParDisque();
        const expected = {};
        for (let size = 1; size <= n; size++) {
          expected[size] = 2 ** (n - size);
        }
        if (!counts || typeof counts !== "object" || !sameObject(counts, expected)) {
          fail("après une partie parfaite à " + n + " disques, `mouvementsParDisque()` devrait renvoyer " + JSON.stringify(expected) + ". Elle renvoie " + JSON.stringify(counts) + ".");
        }
      }
      if (!String(Jeu.prototype.mouvementsParDisque).includes("reduce")) {
        fail("le résultat est juste, mais cette mission demande d'utiliser `reduce`.");
      }
    },

    10: () => {
      for (const n of [1, 3, 5]) {
        const moves = [];
        try {
          resoudre(n, 0, 2, 1, moves);
        } catch (error) {
          const endless = error instanceof RangeError;
          fail("avec " + n + " disque(s), `resoudre` plante : « " + error.message + " »." + (endless ? " La fonction s'appelle sans fin : as-tu écrit l'étape 1 (si n vaut 0, on s'arrête) ?" : ""));
        }
        const expected = 2 ** n - 1;
        if (moves.length !== expected) {
          fail("pour " + n + " disque(s), le moine devrait jouer " + expected + " coups. `resoudre` en a donné " + moves.length + ".");
        }
        newRound(n);
        playMoves(moves);
        if (jeu.tours[2].disques.length !== n) {
          fail("j'ai joué les coups donnés par `resoudre` pour " + n + " disques, mais ils ne sont pas tous arrivés sur la tour de droite.");
        }
      }
    },
  };

  (async () => {
    const passed = [];
    let failure = null;
    for (let stepId = 1; stepId <= stepCount; stepId++) {
      try {
        await CHECKS[stepId]();
        passed.push(stepId);
      } catch (error) {
        const message = error instanceof StepFailure
          ? error.message
          : "le jeu plante pendant mon essai : « " + error.message + " ».";
        failure = { step: stepId, message };
        break;
      }
    }
    parent.postMessage({ passeur: true, channel: "test", runId, type: "results", passed, failure }, "*");
  })();
}

/* ---------- Running the game. ---------- */

let runId = 0;
// The first syntax error of the student's code, or null.
let syntaxProblem = null;
let runTimer = null;
let playFileStarts = [];

function buildGameDocument(scripts, channel, extraScript) {
  let html = contents["index.html"];

  html = html.replace(/<link rel="stylesheet" href="style\.css">/, () => "<style>\n" + contents["style.css"] + "\n</style>");

  html = html.replace(/<script src="([\w-]+\.js)"><\/script>/g, (tag, fileName) => {
    if (!(fileName in scripts)) {
      // The comment opener is split, because it must not appear in this inline script.
      return "<" + "!-- " + fileName + " not found --" + ">";
    }
    return "<script>/*@file:" + fileName + "*/\n" + scripts[fileName] + "\n<\/script>";
  });

  const prelude = "<script>(" + iframePrelude.toString() + ")(" + JSON.stringify(channel) + ", " + runId + ", " + MAX_LOOP_TURNS + ");<\/script>";
  html = html.replace(/<head>/i, (head) => head + prelude);

  if (extraScript) {
    html = html.replace(/<\/body>/i, (bodyEnd) => extraScript + bodyEnd);
  }

  // Remember where each file starts, to turn a line of the page into a line of a file.
  const fileStarts = [];
  for (const fileName of Object.keys(scripts)) {
    const markerIndex = html.indexOf("/*@file:" + fileName + "*/");
    if (markerIndex !== -1) {
      const markerLine = html.slice(0, markerIndex).split("\n").length;
      fileStarts.push({ fileName, firstLine: markerLine + 1 });
    }
  }
  fileStarts.sort((first, second) => first.firstLine - second.firstLine);

  return { html, fileStarts };
}

function locateLine(pageLine, column) {
  let location = null;
  for (const start of playFileStarts) {
    if (pageLine >= start.firstLine) {
      location = { fileName: start.fileName, line: pageLine - start.firstLine + 1, column };
    }
  }
  if (location && location.line > contents[location.fileName].split("\n").length) {
    return null;
  }
  return location;
}

// Finds the file and line of an error, using the stack when the error line is outside the files.
function locateError(data) {
  const direct = locateLine(data.line, data.column);
  if (direct) {
    return direct;
  }
  const positions = String(data.stack || "").matchAll(/:(\d+):(\d+)\)?\s*$/gm);
  for (const position of positions) {
    const location = locateLine(Number(position[1]), Number(position[2]));
    if (location) {
      return location;
    }
  }
  return null;
}

function scheduleRun() {
  clearTimeout(runTimer);
  editorRunStatus.textContent = "modifié…";
  runTimer = setTimeout(runGame, AUTO_RUN_DELAY_MS);
}

function runGame() {
  clearTimeout(runTimer);
  runId += 1;
  clearConsole();
  logSystem("Jeu relancé.");

  const prepared = prepareScripts();
  for (const syntaxError of prepared.syntaxErrors) {
    logToConsole("error", "SyntaxError : " + syntaxError.message, syntaxError);
  }
  syntaxProblem = prepared.syntaxErrors[0] || null;

  const playDocument = buildGameDocument(prepared.scripts, "play", "");
  playFileStarts = playDocument.fileStarts;
  playFrame.srcdoc = playDocument.html;

  editorRunStatus.textContent = "jeu relancé ✓";

  // With a syntax error, the whole file cannot run: checking the missions would make
  // them all fail, as if the student had lost everything. The progress is kept instead.
  if (syntaxProblem) {
    testFrame.srcdoc = "";
    questsStatus.textContent = "";
    ferrymanSay("Ton code contient une erreur de syntaxe (" + syntaxProblem.fileName + ", ligne " + syntaxProblem.line + ") : le jeu ne peut pas démarrer. Tes missions réussies ne sont pas perdues : corrige cette ligne et tout reviendra.", "warning");
    renderQuests();
    renderProgress();
    return;
  }

  const harness = "<script>(" + iframeTestHarness.toString() + ")(" + runId + ", " + STEPS.length + ");<\/script>";
  const testDocument = buildGameDocument(prepared.scripts, "test", harness);
  testFrame.srcdoc = testDocument.html;
  questsStatus.textContent = "le moine vérifie…";
}

window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data || data.passeur !== true || data.runId !== runId) {
    return;
  }
  if (data.channel === "play" && event.source === playFrame.contentWindow) {
    if (data.type === "console") {
      logToConsole(data.level, data.text, null);
    } else if (data.type === "error") {
      logToConsole("error", data.message, locateError(data));
    }
  }
  if (data.channel === "test" && event.source === testFrame.contentWindow && data.type === "results") {
    handleTestResults(data);
  }
});

/* ---------- Console. ---------- */

function clearConsole() {
  consoleOutput.innerHTML = "";
}

function logSystem(text) {
  const line = document.createElement("div");
  line.className = "console-line console-line--system";
  line.textContent = text;
  consoleOutput.append(line);
}

function logToConsole(level, text, location) {
  const line = document.createElement("div");
  line.className = "console-line console-line--" + level;
  line.textContent = (level === "error" ? "❌ " : level === "warn" ? "⚠️ " : "") + text;

  if (location) {
    const link = document.createElement("button");
    link.type = "button";
    link.className = "console-link";
    link.textContent = location.fileName + ", ligne " + location.line;
    link.addEventListener("click", () => jumpToLine(location.fileName, location.line, location.column));
    line.append(" — ", link);
  }

  consoleOutput.append(line);
  consoleOutput.scrollTop = consoleOutput.scrollHeight;
}

/* ---------- Quests and ferryman. ---------- */

let celebratedSteps = new Set(JSON.parse(readStorage("celebrated", "[]")));
let latestResults = { passed: [...celebratedSteps].sort((first, second) => first - second), failure: null };
let ferrymanMood = "";

function findStep(stepId) {
  return STEPS.find((step) => step.id === stepId);
}

function escapeHtml(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// Turns `code` written between backticks into <code> elements.
function formatText(text) {
  return escapeHtml(text).replace(/`([^`]+)`/g, "<code>$1</code>");
}

function ferrymanSay(text, mood) {
  ferrymanMood = mood;
  ferrymanBubble.innerHTML = formatText(text);
  ferrymanBubble.className = "ferryman__bubble" + (mood ? " is-" + mood : "");
  if (mood === "success") {
    ferrymanAvatar.classList.remove("is-happy");
    void ferrymanAvatar.offsetWidth;
    ferrymanAvatar.classList.add("is-happy");
  }
}

function handleTestResults(results) {
  latestResults = results;
  recordDoneSteps(results.passed);
  questsStatus.textContent = "";

  const newlyPassed = results.passed.filter((stepId) => !celebratedSteps.has(stepId));
  const brokenSteps = [...celebratedSteps].filter((stepId) => !results.passed.includes(stepId)).sort((first, second) => first - second);

  if (newlyPassed.length > 0) {
    newlyPassed.forEach((stepId) => celebratedSteps.add(stepId));
    writeStorage("celebrated", JSON.stringify([...celebratedSteps]));
    ferrymanSay(findStep(Math.max(...newlyPassed)).success, "success");
    const nextStep = STEPS.find((step) => !results.passed.includes(step.id));
    if (nextStep !== undefined) {
      jumpToMission(nextStep);
    }
  } else if (brokenSteps.length > 0) {
    const brokenStep = findStep(brokenSteps[0]);
    ferrymanSay("Aïe ! Ton dernier changement a cassé « " + brokenStep.title + " ». Tes missions ne sont pas perdues : lis l'encadré rouge de la mission et regarde la console, elle indique la ligne en cause.", "warning");
  } else if (ferrymanMood === "warning") {
    ferrymanSay("Ouf, tout remarche ! On reprend là où on en était.", "");

  }

  renderQuests();
  renderProgress();
}

function renderProgress() {
  // Missions already done stay counted, even if a later change broke them for a moment.
  const done = new Set([...latestResults.passed, ...celebratedSteps]);
  const doneCount = [...done].filter((stepId) => !findStep(stepId).bonus).length;
  const bonusDone = STEPS.some((step) => step.bonus && done.has(step.id));
  progressFill.style.width = (doneCount / MAIN_STEP_COUNT) * 100 + "%";
  progressLabel.textContent = doneCount + " / " + MAIN_STEP_COUNT + (bonusDone ? " ⭐" : "");
}

// The current mission is the first one never done: a mission that is broken again
// does not send the student back to it, a warning is shown instead.
function findCurrentStep() {
  const passed = new Set(latestResults.passed);
  return STEPS.find((step) => !passed.has(step.id) && !celebratedSteps.has(step.id));
}

// A mission already done that does not pass any more (because of a later change).
function findBrokenStep() {
  if (syntaxProblem || !latestResults.failure) {
    return undefined;
  }
  const step = findStep(latestResults.failure.step);
  return step && celebratedSteps.has(step.id) ? step : undefined;
}

// The list under the game: one line per mission, without details.
function renderQuests() {
  const passed = new Set(latestResults.passed);
  const currentStep = findCurrentStep();
  questList.innerHTML = "";

  const brokenStep = findBrokenStep();
  for (const step of STEPS) {
    const isDone = passed.has(step.id) || celebratedSteps.has(step.id);
    const isBroken = brokenStep !== undefined && step.id === brokenStep.id;
    const isCurrent = currentStep !== undefined && step.id === currentStep.id;
    const item = document.createElement("li");
    item.className = "quest " + (isDone ? "quest--done" : isCurrent ? "quest--current" : "quest--locked");

    const icon = isBroken ? "⚠️" : isDone ? "✅" : isCurrent ? "👉" : step.bonus ? "⭐" : "🔒";
    const title = isDone || isCurrent ? escapeHtml(step.title) + (step.bonus ? " (bonus)" : "") : step.bonus ? "Mission bonus secrète" : "Mission secrète";
    const tag = isDone || isCurrent ? '<span class="quest__tag">' + escapeHtml(step.notion) + "</span>" : "";
    item.innerHTML =
      '<span class="quest__icon">' + icon + "</span>" +
      '<span class="quest__title">' + step.id + ". " + title + tag + "</span>";
    questList.append(item);
  }

  renderMission(currentStep);
}

// The card above the game: what is broken, where to look, and a hint.
function renderMission(step) {
  missionElement.innerHTML = "";

  if (step === undefined) {
    missionElement.className = "mission mission--done";
    missionElement.innerHTML =
      '<p class="mission__label">Toutes les missions sont finies</p>' +
      '<h2 class="mission__title">🎉 Le jeu est réparé !</h2>' +
      '<p class="mission__text">Dernier défi : finis l\'énigme avec 4 disques en 15 coups, sans l\'aide du moine.</p>';
    addAlertBox();
    return;
  }

  missionElement.className = "mission";
  missionElement.innerHTML =
    '<p class="mission__label">' + (step.bonus ? "⭐ Mission bonus : le jeu est déjà réparé, celle-ci est pour les plus courageux" : "Mission " + step.id + " sur " + MAIN_STEP_COUNT) + "</p>" +
    '<h2 class="mission__title">' + escapeHtml(step.title) + "</h2>" +
    '<p class="mission__kind">' + formatText(KIND_LABELS[step.kind]) + "</p>" +
    '<dl class="mission__facts">' +
    "<dt>Ce qui ne marche pas</dt><dd>" + formatText(step.symptom) + "</dd>" +
    '<dt>Où chercher</dt><dd><button type="button" class="file-link">📍 Aller à la mission ' + step.id + " dans " + escapeHtml(step.file) + "</button>" +
    ' <span class="mission__notion">Notion : ' + escapeHtml(step.notion) + "</span></dd>" +
    "</dl>";

  missionElement.querySelector(".file-link").addEventListener("click", () => jumpToMission(step));
  addAlertBox();

  const failure = latestResults.failure;
  if (failure && failure.step === step.id) {
    const check = document.createElement("p");
    check.className = "mission__check";
    check.innerHTML = "🔍 Le moine a essayé : " + formatText(failure.message);
    missionElement.append(check);
  }

  const freeHint = document.createElement("p");
  freeHint.className = "mission__hint";
  freeHint.innerHTML = "💡 <strong>Indice :</strong> " + formatText(step.freeHint);
  missionElement.append(freeHint, createJokerBox(step));
}

// A red box at the top of the mission card when the code does not run any more:
// a syntax error, or a mission already done that a later change broke.
function addAlertBox() {
  const brokenStep = findBrokenStep();
  if (!syntaxProblem && brokenStep === undefined) {
    return;
  }
  const box = document.createElement("div");
  box.className = "mission__alert";
  const location = syntaxProblem || null;
  if (syntaxProblem) {
    box.innerHTML = "<p>⚠️ <strong>Erreur de syntaxe</strong> dans " + escapeHtml(syntaxProblem.fileName) + ", ligne " + syntaxProblem.line + " : " + escapeHtml(syntaxProblem.message) + "</p>" +
      "<p>Tant qu'elle est là, le jeu ne peut pas démarrer. Tes missions réussies ne sont pas perdues.</p>";
  } else {
    box.innerHTML = "<p>⚠️ <strong>Ton dernier changement a cassé la mission " + brokenStep.id + " « " + escapeHtml(brokenStep.title) + " ».</strong></p>" +
      "<p>🔍 Le moine a essayé : " + formatText(latestResults.failure.message) + "</p>" +
      "<p>Tes missions réussies ne sont pas perdues. La console, sous l'éditeur, indique la ligne en cause : c'est souvent dans le code que tu viens d'écrire.</p>";
  }
  if (location) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "file-link";
    button.textContent = "📍 Aller à la ligne " + location.line;
    button.addEventListener("click", () => jumpToLine(location.fileName, location.line, location.column));
    box.append(button);
  }
  missionElement.prepend(box);
}

// The joker part of the mission card: a button to spend a joker, or the joker hint once it is bought.
function createJokerBox(step) {
  const box = document.createElement("div");
  box.className = "joker-box";

  if (score.jokerSteps.includes(step.id)) {
    box.innerHTML = "<p>🃏 <strong>Indice joker :</strong> " + formatText(step.jokerHint) + "</p>";
    return box;
  }

  const remaining = remainingJokers();
  const text = document.createElement("p");
  text.innerHTML = remaining > 0
    ? "Toujours bloqué ? Un <strong>joker</strong> te donne un indice bien plus précis, mais il coûte <strong>" + POINTS.joker + " points</strong>. Il te reste <strong>" + remaining + " joker" + (remaining > 1 ? "s" : "") + "</strong> pour tout le jeu."
    : "Tu as utilisé tous tes jokers. Relis l'indice, le commentaire de la mission et la console : tu vas trouver !";

  const button = document.createElement("button");
  button.type = "button";
  button.className = "joker-button";
  button.textContent = "🃏 Utiliser un joker (−" + POINTS.joker + " pts)";
  button.disabled = remaining === 0;

  let confirmTimer = null;
  button.addEventListener("click", async () => {
    if (!button.classList.contains("is-confirming")) {
      button.classList.add("is-confirming");
      button.textContent = "Sûr ? Clique encore pour perdre " + POINTS.joker + " points";
      confirmTimer = setTimeout(() => {
        button.classList.remove("is-confirming");
        button.textContent = "🃏 Utiliser un joker (−" + POINTS.joker + " pts)";
      }, 4000);
      return;
    }
    clearTimeout(confirmTimer);
    await useJoker(step);
  });

  box.append(text, button);
  return box;
}

/* ---------- Score, jokers and the code for the teacher. ---------- */

let score = null;
let scoreKey = null;

function toBase64Url(bytes) {
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function fromBase64Url(text) {
  const padded = text.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((text.length + 3) % 4);
  return Uint8Array.from(atob(padded), (character) => character.charCodeAt(0));
}

async function getScoreKey() {
  if (scoreKey === null) {
    const rawKey = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(SCORE_SECRET));
    scoreKey = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["encrypt", "decrypt"]);
  }
  return scoreKey;
}

// Encrypts an object into a short text. Any change to the text makes it unreadable.
async function seal(data) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await getScoreKey(), new TextEncoder().encode(JSON.stringify(data)));
  const bytes = new Uint8Array(12 + encrypted.byteLength);
  bytes.set(iv);
  bytes.set(new Uint8Array(encrypted), 12);
  return toBase64Url(bytes);
}

async function unseal(text) {
  const bytes = fromBase64Url(text);
  const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.slice(0, 12) }, await getScoreKey(), bytes.slice(12));
  return JSON.parse(new TextDecoder().decode(decrypted));
}

function createFreshScore(tampered) {
  return { version: 1, start: Date.now(), name: "", steps: {}, jokerSteps: [], tampered };
}

async function loadScore() {
  const saved = readStorage("score", null);
  if (saved === null) {
    score = createFreshScore(false);
    await saveScore();
    return;
  }
  try {
    score = Object.assign(createFreshScore(false), await unseal(saved));
  } catch (error) {
    score = createFreshScore(true);
    await saveScore();
  }
}

async function saveScore() {
  writeStorage("score", await seal(score));
}

// All the missions done, bonus included (each one gives points).
function missionsDone() {
  return Object.keys(score.steps).length;
}

function mainMissionsDone() {
  return Object.keys(score.steps).filter((stepId) => !findStep(Number(stepId))?.bonus).length;
}

function bonusDone() {
  return STEPS.some((step) => step.bonus && score.steps[step.id] !== undefined);
}

function remainingJokers() {
  return Math.max(0, JOKER_COUNT - score.jokerSteps.length);
}

function computePoints() {
  return Math.max(0, missionsDone() * POINTS.mission - score.jokerSteps.length * POINTS.joker);
}

function showPointsToast(text) {
  const toast = document.createElement("div");
  toast.className = "points-toast";
  toast.textContent = text;
  document.body.append(toast);
  setTimeout(() => toast.remove(), 2600);
}

// Records the missions that pass for the first time.
async function recordDoneSteps(passedIds) {
  const newIds = passedIds.filter((stepId) => score.steps[stepId] === undefined);
  if (newIds.length === 0) {
    return;
  }
  for (const stepId of newIds) {
    score.steps[stepId] = Date.now();
  }
  await saveScore();
  showPointsToast("+" + newIds.length * POINTS.mission + " points ⭐");
  renderScore();
}

async function useJoker(step) {
  if (remainingJokers() === 0 || score.jokerSteps.includes(step.id)) {
    return;
  }
  score.jokerSteps.push(step.id);
  await saveScore();
  showPointsToast("−" + POINTS.joker + " points 🃏");
  renderScore();
  renderQuests();
}

async function createTeacherCode() {
  return TEACHER_CODE_PREFIX + await seal({
    name: score.name,
    points: computePoints(),
    missions: mainMissionsDone(),
    bonus: bonusDone(),
    jokers: score.jokerSteps.length,
    jokerSteps: score.jokerSteps,
    steps: score.steps,
    start: score.start,
    at: Date.now(),
    tampered: score.tampered,
  });
}

function renderScore() {
  scorePointsElement.textContent = computePoints();

  scoreJokersElement.innerHTML = "";
  for (let index = 0; index < JOKER_COUNT; index++) {
    const icon = document.createElement("span");
    icon.className = "joker-icon" + (index < score.jokerSteps.length ? " is-used" : "");
    icon.textContent = "🃏";
    scoreJokersElement.append(icon);
  }
  scoreJokersElement.title = remainingJokers() + " joker(s) restant(s) sur " + JOKER_COUNT;

  scoreCardElement.innerHTML =
    "<h2>⭐ Mon score : " + computePoints() + " points</h2>" +
    '<p class="score-card__rules">+' + POINTS.mission + " points par mission réussie · −" + POINTS.joker + " points par joker utilisé · " + JOKER_COUNT + " jokers pour tout le jeu</p>" +
    "<p>" + mainMissionsDone() + " mission(s) réussie(s) sur " + MAIN_STEP_COUNT + (bonusDone() ? " + la mission bonus ⭐" : "") + " · " + score.jokerSteps.length + " joker(s) utilisé(s)</p>" +
    (score.tampered ? '<p class="score-card__warning">⚠ Le score enregistré a été modifié : ce sera signalé à l\'enseignant.</p>' : "") +
    '<div class="score-card__row"><input id="student-name" type="text" maxlength="60" autocomplete="off" placeholder="Ton prénom et ton nom">' +
    '<button id="teacher-code-button" type="button" class="primary-button">Code pour l\'enseignant</button></div>' +
    '<p class="score-card__note">À la fin de la séance, génère ce code et colle-le dans ton rendu.</p>' +
    '<pre id="teacher-code-output" class="score-card__code" hidden></pre>';

  const nameInput = document.getElementById("student-name");
  nameInput.value = score.name;
  nameInput.addEventListener("change", async () => {
    score.name = nameInput.value.trim();
    await saveScore();
  });

  document.getElementById("teacher-code-button").addEventListener("click", async () => {
    score.name = nameInput.value.trim();
    await saveScore();
    if (score.name === "") {
      nameInput.focus();
      showPointsToast("Écris d'abord ton prénom et ton nom.");
      return;
    }
    const code = await createTeacherCode();
    const output = document.getElementById("teacher-code-output");
    output.hidden = false;
    output.textContent = code;
    try {
      await navigator.clipboard.writeText(code);
      showPointsToast("Code copié ✅ Colle-le dans ton rendu.");
    } catch (error) {
      showPointsToast("Sélectionne le code et copie-le (Ctrl + C).");
    }
  });
}

/* ---------- Teacher space: open the page with #prof at the end of the address. ---------- */

function formatDate(time) {
  return new Date(time).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" });
}

function renderTeacherSpace() {
  const isTeacher = location.hash === "#prof";
  teacherSpaceElement.hidden = !isTeacher;
  if (!isTeacher) {
    return;
  }

  teacherSpaceElement.innerHTML =
    '<div class="teacher-space__panel">' +
    "<h2>Espace enseignant</h2>" +
    "<p>Colle les codes des étudiants (un par ligne), puis clique sur « Vérifier ».</p>" +
    '<textarea id="teacher-input" spellcheck="false"></textarea>' +
    '<div><button id="teacher-check" type="button" class="primary-button">Vérifier</button></div>' +
    '<div id="teacher-output"></div>' +
    "</div>";

  document.getElementById("teacher-check").addEventListener("click", async () => {
    const rows = [];
    const codes = document.getElementById("teacher-input").value.split(/\s+/).filter(Boolean);
    for (const code of codes) {
      try {
        rows.push({ ok: true, ...(await unseal(code.replace(TEACHER_CODE_PREFIX, ""))) });
      } catch (error) {
        rows.push({ ok: false, raw: code.slice(0, 24) + "…" });
      }
    }

    const lines = rows.map((row) => {
      if (!row.ok) {
        return '<tr><td colspan="7">' + escapeHtml(row.raw) + '</td><td class="is-bad">✗ code invalide</td></tr>';
      }
      const lastStepTime = Math.max(row.start, ...Object.values(row.steps || {}));
      return "<tr>" +
        "<td>" + escapeHtml(row.name) + "</td>" +
        '<td class="number">' + row.points + "</td>" +
        '<td class="number">' + row.missions + " / " + MAIN_STEP_COUNT + (row.bonus ? " + ⭐ bonus" : "") + "</td>" +
        '<td class="number">' + row.jokers + (row.jokerSteps.length ? " (missions " + row.jokerSteps.join(", ") + ")" : "") + "</td>" +
        "<td>" + formatDate(row.start) + "</td>" +
        "<td>" + formatDate(lastStepTime) + "</td>" +
        "<td>" + formatDate(row.at) + "</td>" +
        (row.tampered ? '<td class="is-bad">⚠ score modifié</td>' : "<td>OK</td>") +
        "</tr>";
    });

    document.getElementById("teacher-output").innerHTML =
      '<table class="teacher-table"><thead><tr><th>Nom</th><th class="number">Points</th><th class="number">Missions</th><th class="number">Jokers</th><th>Début</th><th>Dernière mission</th><th>Code généré</th><th>État</th></tr></thead>' +
      "<tbody>" + lines.join("") + "</tbody></table>" +
      "<p>« Début » est le moment où l'étudiant a ouvert le jeu pour la première fois dans ce navigateur. Un début bien après le début de la séance peut indiquer qu'il a effacé ses données pour repartir de zéro.</p>";
  });
}

window.addEventListener("hashchange", renderTeacherSpace);

/* ---------- Header buttons and keyboard. ---------- */

let resetConfirmTimer = null;

function restoreResetButton() {
  clearTimeout(resetConfirmTimer);
  resetButton.classList.remove("is-confirming");
  resetButton.textContent = "↺ Code d'origine";
}

function resetAllFiles() {
  for (const file of FILES) {
    removeStorage("file." + file.name);
    setFileContent(file.name, originalContents[file.name]);
    contents[file.name] = originalContents[file.name];
  }
  celebratedSteps = new Set();
  removeStorage("celebrated");
  latestResults = { passed: [], failure: null };
  ferrymanSay(INTRO_MESSAGE, "");
  renderTabs();
  renderQuests();
  renderProgress();
  runGame();
}

resetButton.addEventListener("click", () => {
  if (!resetButton.classList.contains("is-confirming")) {
    resetButton.classList.add("is-confirming");
    resetButton.textContent = "Sûr ? Tout ton code sera effacé";
    resetConfirmTimer = setTimeout(restoreResetButton, 4000);
    return;
  }
  restoreResetButton();
  resetAllFiles();
});

// Manual restart (button or Ctrl+S): the game restarts with a visible flash.
function restartByHand() {
  runGame();
  playFrame.classList.remove("is-restarting");
  void playFrame.offsetWidth;
  playFrame.classList.add("is-restarting");
  showPointsToast("Jeu relancé ↻");
}

runButton.addEventListener("click", restartByHand);
clearConsoleButton.addEventListener("click", clearConsole);

document.addEventListener("keydown", (event) => {
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
    event.preventDefault();
    restartByHand();
  }
});

/* ---------- Start. ---------- */

async function start() {
  await loadScore();
  setupEditor();
  const startStep = findCurrentStep();
  if (startStep !== undefined) {
    jumpToMission(startStep, false);
  } else {
    showFile(activeFileName);
  }
  ferrymanSay(celebratedSteps.size === 0 ? INTRO_MESSAGE : WELCOME_BACK_MESSAGE, "");
  renderScore();
  renderQuests();
  renderProgress();
  renderTeacherSpace();
  runGame();
}

start();
</script>
